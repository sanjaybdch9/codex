apiVersion: batch/v1
kind: Job
metadata:
  name: gst-billing-migrate
  namespace: gst-billing
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: migrate
          image: registry.example.com/gst-billing:latest
          imagePullPolicy: Always
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: gst-billing-config
            - secretRef:
                name: gst-billing-secrets
