apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gst-billing
  namespace: gst-billing
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - gst-billing.example.com
      secretName: gst-billing-tls
  rules:
    - host: gst-billing.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gst-billing
                port:
                  number: 80
