apiVersion: v1
kind: Service
metadata:
  name: gst-billing
  namespace: gst-billing
spec:
  selector:
    app: gst-billing
  ports:
    - port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gst-billing
  namespace: gst-billing
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gst-billing
  template:
    metadata:
      labels:
        app: gst-billing
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: gst-billing
          image: registry.example.com/gst-billing:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: gst-billing-config
            - secretRef:
                name: gst-billing-secrets
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
